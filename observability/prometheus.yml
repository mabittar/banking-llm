global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Metrics pushed by the app via OTLP are exposed by the Collector's
  # prometheus exporter on :8889.
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
